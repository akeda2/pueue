- name: pueue
  active: true
  queue-mode: serial
  path: ~/dev/pueue
  build: ./inst.sh --mode user --install-completions --yes
  post-build: gb -I pueue.yaml -w -a
  interval: 3600
- name: pueue-restart
  active: true
  disable-when-run: true
  run-mode: scheduled
  path: ~/dev/pueue
  test: systemctl --user restart pueued.service
  at: "04:00"
  
