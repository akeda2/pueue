- name: pueue
  active: true
  path: ~/dev/pueue
  pre-build: ./inst.sh --install-cargo
  build: ./inst.sh --mode user --install-completions --yes
  post-build: gb -I pueue.yaml -w
  interval: 3600
- name: pueue-restart
  active: true
  run-mode: scheduled
  path: ~/dev/pueue
  pre-build: "sed -i '/^- name: pueue-restart$/,/^- name: / s/^\\([[:space:]]*active:[[:space:]]*\\)true$/\\1false/' ~/.config/gfff/pueue.yaml"
  test: systemctl --user restart pueued.service
  at: "04:00"
  
